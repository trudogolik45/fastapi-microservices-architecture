[project]
name = "fast-store"
version = "0.1.0"
description = "FastAPI microservices monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pyjwt>=2.15.1",
]

[tool.uv.workspace]
members = [
    "services/user-service",
    "services/product-service",
    "services/order-service",
    "services/inventory-service",
]
