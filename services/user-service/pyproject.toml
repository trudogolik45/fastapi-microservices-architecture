[project]
name = "user-service"
version = "0.1.0"
description = "User service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.0",
    "grpcio>=1.85.1",
    "grpcio-tools>=1.85.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.7",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# "." for local modules (main, db, ...), "../.." for the shared package
pythonpath = [".", "../.."]
